<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="U-Calm Aviation — Aviation, arranged.">
  <!--
    U-Calm Aviation — Open Graph holding card.
    1200x630 is the standard OG image size used by WhatsApp, iMessage,
    LinkedIn, Slack, Twitter/X, Facebook. Replace this SVG with a
    photographic OG (e.g. one of the curated cabin-stills or Three Cities
    images) once the imagery library is curated.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2B3A"/>
      <stop offset="1" stop-color="#0F1A24"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Champagne hairline frame -->
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#BCB17A" stroke-width="1" opacity="0.55"/>

  <!-- Tall airy U mark on the left third -->
  <g transform="translate(220 215)" fill="none" stroke="#3BB5C7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="0" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="120"/>
    <path d="M 0 120 C 0 195, 100 195, 100 120"/>
  </g>

  <!-- Wordmark stack on the right two-thirds -->
  <g transform="translate(420 250)">
    <text x="0" y="0"
          font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif"
          font-size="120" font-weight="300" letter-spacing="14" fill="#3BB5C7">CALM</text>
    <text x="0" y="80"
          font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif"
          font-size="72" font-weight="300" letter-spacing="14" fill="#BCB17A">AVIATION</text>
  </g>

  <!-- Strapline + URL footer -->
  <text x="600" y="500" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
        font-size="32" font-style="italic" font-weight="300" fill="#FAF7F2" opacity="0.9">
    Aviation, arranged.
  </text>
  <text x="600" y="540" text-anchor="middle"
        font-family="'Lato', Arial, sans-serif"
        font-size="14" font-weight="400" letter-spacing="6" fill="#BCB17A" opacity="0.85">
    LUGANO  ·  MILAN  ·  LONDON
  </text>
</svg>
